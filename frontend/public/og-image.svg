<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#009DFF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#009DFF;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Glow effect -->
  <ellipse cx="900" cy="315" rx="300" ry="300" fill="url(#glowGrad)"/>
  
  <!-- Grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>
  
  <!-- Logo text -->
  <text x="80" y="280" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff">oVoxi</text>
  <text x="295" y="280" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="700" fill="#009DFF">.ai</text>
  
  <!-- Tagline -->
  <text x="80" y="350" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#009DFF">THE ETHICAL ARCHITECTURE FOR GENERATIVE SOUND</text>
  
  <!-- Description -->
  <text x="80" y="420" font-family="Inter, Arial, sans-serif" font-size="20" fill="#888888">The world's first high-fidelity provenance layer</text>
  <text x="80" y="450" font-family="Inter, Arial, sans-serif" font-size="20" fill="#888888">for the AI music era.</text>
  
  <!-- Bottom border accent -->
  <rect x="0" y="620" width="1200" height="10" fill="#009DFF"/>
</svg>
